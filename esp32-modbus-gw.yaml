# Board: Generic ESP32-S3 Board (Generic)
# Definition: definitions/boards/generic-esp32s3/manifest.yaml
#
#   MASTER     UART 1         UART2       SLAVE
#      |   REQ-->|              |--REQ-->   |
#      |         |              |           |
#      |         |              | <--RESP-- |
#      |<--RESP--|   <--RESP----|           |
#

esphome:
  name: esp32-modbus-wp
  friendly_name: ESP32_Modbus_WP
  includes: [modbus_crc.h, uart_actions.cpp]

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "CwWzy8Pk9e1iB3Fih6Ctmrt5u7Wycx9vnNVYpKwiR/0="

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ESP32_Modbus_WP Fallback Hotspot
    password: "aAAKPM27a8vQ"

captive_portal:

number:
  - platform: template
    id: value
    name: "uart_value"
    mode: SLIDER
    min_value: 0
    max_value: 255
    step: 1
    optimistic: true
    on_value:
      then:
        - uart.write:
            id: uart_2
            # REQUEST: slave=0x21 FC01 start=0x0000 quantity=6
            # HEX: 21.01.00.00.00.06.BB.68
            data: [0x21, 0x01, 0x00, 0x00, 0x00, 0x06, 0xbb, 0x68]

uart:
  - id: uart_1
    baud_rate: 9600
    rx_pin: GPIO8
    tx_pin: GPIO9
    flow_control_pin:
      number: GPIO10
    debug:
      direction: RX
      dummy_receiver: true
      debug_prefix: "[UART_1]"
      after:
        timeout: 4ms
      sequence:
        - lambda: |-
            actions::master(bytes);

  - id: uart_2
    baud_rate: 9600
    rx_pin: GPIO11
    tx_pin: GPIO12
    flow_control_pin: GPIO13
    debug:
      direction: RX
      dummy_receiver: true
      debug_prefix: "[UART_2]"
      after:
        timeout: 4ms
      sequence:
        - lambda: |-
            ESP_LOGI("SLAVE", "RX: %s",
                   format_hex_pretty(bytes).c_str());

...
