uart:
  id: modbus_uart
  rx_pin: GPIO11      
  tx_pin: GPIO12
  flow_control_pin: GPIO13
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1

  debug:
    direction: RX
    dummy_receiver: true
    debug_prefix: "[MODBUS]"
    after:
      timeout: 20ms

    sequence:
      - lambda: |-
          static std::vector<uint8_t> buffer;
          // Neue Bytes an den Puffer anhängen
          for (auto byte : bytes) {
            buffer.push_back(byte);
          }
          
          // ------------------------------------------------------------
          // Modbus RTU CRC16
          // ------------------------------------------------------------
          auto crc16 = [](const uint8_t *data, size_t len) -> uint16_t {
            uint16_t crc = 0xFFFF;
          
            for (size_t i = 0; i < len; i++) {
              crc ^= data[i];
          
              for (int j = 0; j < 8; j++) {
                if (crc & 1)
                  crc = (crc >> 1) ^ 0xA001;
                else
                  crc >>= 1;
              }
            }
          
            return crc;
          };
          
          // ------------------------------------------------------------
          // FLOAT32, Modbus Big Endian
          // ------------------------------------------------------------
          auto float32_be = [](const uint8_t *p) -> float {
            uint32_t raw =
                ((uint32_t)p[0] << 24) |
                ((uint32_t)p[1] << 16) |
                ((uint32_t)p[2] << 8)  |
                ((uint32_t)p[3]);
          
            float value;
            memcpy(&value, &raw, sizeof(value));
            return value;
          };

          ESP_LOGI("[MODBUS]", ">>> lambda begin");
          UARTDebug::log_hex(direction, buffer, ':', debug_prefix);
          
          // ------------------------------------------------------------
          // Frame verarbeiten
          // ------------------------------------------------------------
          while (buffer.size() >= 5) {
          
            bool found = false;
            size_t frame_len = 0;
          
            uint8_t slave = buffer[0];
            uint8_t fc    = buffer[1];
          
            // ----------------------------------------------------------
            // ZUERST: Antworten prüfen
            //
            // Response:
            // slave fc byte_count data... crc
            //
            // byte_count == 0 ist keine gültige normale Antwort.
            // Dadurch werden Requests wie
            //
            // 21 04 00 0D 00 01 CRC
            //
            // nicht mehr als Response interpretiert.
            // ----------------------------------------------------------
            if (!found &&
                fc >= 1 && fc <= 4 &&
                buffer.size() >= 3) {
          
              uint8_t byte_count = buffer[2];
          
              if (byte_count > 0) {
          
                // FC03 / FC04 liefern 16-Bit-Register,
                // daher muss die Anzahl der Datenbytes gerade sein.
                bool valid_byte_count = true;
          
                if ((fc == 3 || fc == 4) &&
                    (byte_count % 2 != 0)) {
                  valid_byte_count = false;
                }
          
                if (valid_byte_count) {
          
                  size_t expected =
                      3 + byte_count + 2;
          
                  if (buffer.size() >= expected) {
          
                    uint16_t calc =
                        crc16(buffer.data(), expected - 2);
          
                    uint16_t received =
                        (uint16_t)buffer[expected - 2] |
                        ((uint16_t)buffer[expected - 1] << 8);
          
                    if (calc == received) {
                      frame_len = expected;
                      found = true;
                    }
                  }
                }
              }
            }
          
            // ----------------------------------------------------------
            // DANACH: Anfragen prüfen
            //
            // FC01..FC06 = 8 Bytes
            // ----------------------------------------------------------
            if (!found && fc >= 1 && fc <= 6) {
          
              if (buffer.size() >= 8) {
          
                uint16_t calc =
                    crc16(buffer.data(), 6);
          
                uint16_t received =
                    (uint16_t)buffer[6] |
                    ((uint16_t)buffer[7] << 8);
          
                if (calc == received) {
                  frame_len = 8;
                  found = true;
                }
              }
            }
          
            // ----------------------------------------------------------
            // Wenn noch kein vollständiger Frame da ist:
            // auf weitere Bytes warten.
            // ----------------------------------------------------------
            if (!found) {
          
              if (slave != 0x01 && slave != 0x21) {
                buffer.erase(buffer.begin());
              }
          
              break;
            }
          
            // ----------------------------------------------------------
            // Frame gefunden
            // ----------------------------------------------------------
            const uint8_t *f = buffer.data();
          
            ESP_LOGI(
                "MODBUS_DEC",
                "FRAME: slave=0x%02X (%u), FC=%u, LEN=%u",
                f[0], f[0], f[1], frame_len
            );
          
            // ----------------------------------------------------------
            // HEX-Ausgabe
            // ----------------------------------------------------------
            std::string hex;
          
            char tmp[4];
          
            for (size_t i = 0; i < frame_len; i++) {
          
              snprintf(
                  tmp,
                  sizeof(tmp),
                  "%02X",
                  f[i]
              );
          
              if (!hex.empty())
                hex += ".";
          
              hex += tmp;
            }
          
            ESP_LOGI(
                "MODBUS_DEC",
                "HEX: %s",
                hex.c_str()
            );

            // ----------------------------------------------------------
            // Request-Informationen ausgeben
            // FC01..FC06 Requests sind 8 Byte lang:
            //
            // slave fc start_hi start_lo quantity_hi quantity_lo crc
            // ----------------------------------------------------------
            if (frame_len == 8 &&
                f[1] >= 1 &&
                f[1] <= 6) {
            
              uint16_t start =
                  ((uint16_t)f[2] << 8) |
                  f[3];
            
              uint16_t quantity =
                  ((uint16_t)f[4] << 8) |
                  f[5];
            
              ESP_LOGI(
                  "MODBUS_DEC",
                  "REQUEST: slave=0x%02X FC%02X start=0x%04X quantity=%u",
                  f[0],
                  f[1],
                  start,
                  quantity
              );
            }
          
            // ==========================================================
            // LG THERMA V R290
            // Slave 0x21
            // ==========================================================
            if (f[0] == 0x21) {
          
              // --------------------------------------------------------
              // FC04 Response
              // --------------------------------------------------------
              if (f[1] == 0x04 && frame_len >= 5) {
          
                uint8_t byte_count = f[2];
                uint16_t registers = byte_count / 2;
          
                ESP_LOGI(
                    "LG_R290",
                    "FC04 response: %u registers",
                    registers
                );
          
                for (uint16_t r = 0;
                     r < registers;
                     r++) {
          
                  size_t pos = 3 + r * 2;
          
                  uint16_t value =
                      ((uint16_t)f[pos] << 8) |
                      f[pos + 1];
          
                  ESP_LOGI(
                      "LG_R290",
                      "IR%u = 0x%04X = %u",
                      r,
                      value,
                      value
                  );
                }
              }
          
              // --------------------------------------------------------
              // FC03 Response
              // --------------------------------------------------------
              else if (f[1] == 0x03 &&
                       frame_len >= 5) {
          
                uint8_t byte_count = f[2];
                uint16_t registers = byte_count / 2;
          
                ESP_LOGI(
                    "LG_R290",
                    "FC03 response: %u registers",
                    registers
                );
          
                for (uint16_t r = 0;
                     r < registers;
                     r++) {
          
                  size_t pos = 3 + r * 2;
          
                  uint16_t value =
                      ((uint16_t)f[pos] << 8) |
                      f[pos + 1];
          
                  ESP_LOGI(
                      "LG_R290",
                      "HR%u = 0x%04X = %u",
                      r,
                      value,
                      value
                  );
                }
              }
          
              // --------------------------------------------------------
              // FC01 / FC02 Response
              //
              // Noch keine Namen vergeben.
              // Wir geben zunächst die einzelnen Bits aus.
              // --------------------------------------------------------
              else if ((f[1] == 0x01 ||
                        f[1] == 0x02) &&
                       frame_len >= 5) {
          
                uint8_t byte_count = f[2];
          
                ESP_LOGI(
                    "LG_R290",
                    "FC%02X response: %u data bytes",
                    f[1],
                    byte_count
                );
          
                for (uint8_t bit = 0;
                     bit < byte_count * 8;
                     bit++) {
          
                  uint8_t data_byte =
                      f[3 + bit / 8];
          
                  bool state =
                      (data_byte &
                       (1 << (bit % 8)));
          
                  ESP_LOGI(
                      "LG_R290",
                      "FC%02X bit %u = %s",
                      f[1],
                      bit,
                      state ? "ON" : "OFF"
                  );
                }
              }
            }
          
            // ==========================================================
            // EASTRON SDM72
            // Slave 0x01
            // ==========================================================
            if (f[0] == 0x01) {
          
              // --------------------------------------------------------
              // FC04 response
              // --------------------------------------------------------
              if (f[1] == 0x04 &&
                  frame_len >= 7) {
          
                uint8_t byte_count = f[2];
          
                // 0x0034 = Total Active Power
                //
                // Antwort:
                // 01 04 04 xx xx xx xx CRC
                //
                if (byte_count == 4) {
          
                  float power =
                      float32_be(&f[3]);
          
                  ESP_LOGI(
                      "SDM72",
                      "Total Active Power (0x0034): %.3f W",
                      power
                  );
                  id(sdm72_gesamtleistung).publish_state(power);
                }
              }
            }
          
            // ----------------------------------------------------------
            // Verarbeitetes Frame aus dem Buffer entfernen
            // ----------------------------------------------------------
            buffer.erase(
                buffer.begin(),
                buffer.begin() + frame_len
            );
          }