# Board: Generic ESP32-S3 Board (Generic)
# Definition: definitions/boards/generic-esp32s3/manifest.yaml

esphome:
  name: esp32-modbus-sniffer
  friendly_name: esp32-modbus-sniffer
  includes: [modbus_crc.h, sniffer_lambda.h]

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

logger:
  baud_rate: 115200

api:
  encryption:
    key: 94V86cdaBewTqd1ryuk8FoSe+BjLOKGRgRCN9jyyV+E=
ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ESP32_Modbus_WP Fallback Hotspot
    password: "aAAKPM27a8vQ"

captive_portal:

sensor:
  # ============================================================
  # LG Therma V R290
  # ============================================================

  - platform: template
    id: lg_wasser_ruecklauf
    name: "LG Wasser Rücklauf"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    id: lg_wasser_vorlauf
    name: "LG Wasser Vorlauf"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    id: lg_ww_temperatur
    name: "LG Warmwasser Temperatur"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    id: lg_hk1_raumtemperatur
    name: "LG Heizkreis 1 Raumtemperatur"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    id: lg_hk2_vorlauf
    name: "LG Heizkreis 2 Vorlauf"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    id: lg_hk2_raumtemperatur
    name: "LG Heizkreis 2 Raumtemperatur"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    id: lg_aussentemperatur
    name: "LG Außentemperatur"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    id: lg_wasserdruck
    name: "LG Wasserdruck"
    unit_of_measurement: "bar"
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    id: lg_durchfluss
    name: "LG Wasserdurchfluss"
    unit_of_measurement: "L/min"
    state_class: measurement
    accuracy_decimals: 1


  # ============================================================
  # Eastron SDM72
  # ============================================================

  - platform: template
    id: sdm72_gesamtleistung
    name: "SDM72 Gesamtleistung"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 1

uart:
  id: modbus_uart
  rx_pin: GPIO11
  tx_pin: GPIO12
  flow_control_pin: GPIO13
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1

  debug:
    direction: RX
    dummy_receiver: true
    debug_prefix: "[MODBUS]"
    after:
      timeout: 20ms

    sequence:
      - lambda: !include sniffer_lambda.h
